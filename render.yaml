services:
  # -------------------------------------------------------------
  # FinAssist AI Backend (FastAPI + ChromaDB) on Render
  # -------------------------------------------------------------
  - type: web
    name: finassist-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: deepseek-r1-distill-llama-70b
      - key: EMBEDDING_MODEL
        value: all-minilm
      - key: FRONTEND_ORIGIN
        value: "*"
      # Add your free Groq API key in the Render Dashboard under Environment Variables
      - key: GROQ_API_KEY
        sync: false
